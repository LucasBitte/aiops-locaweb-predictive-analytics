version: 2

models:
  - name: dim_produto_categoria
    description: "Dimensão unificada de produtos e suas respectivas categorias/subcategorias para otimização de performance no Power BI."
    columns:
      - name: dim_produto_categoria_sk
        description: "Chave substituta (Surrogate Key) primária obtida através do hash MD5 dos três atributos combinados."
        tests:
          - unique
          - not_null
  - name: dim_grupo
    description: "Tabela dimensão que armazena as equipes e grupos de suporte designados para o atendimento dos chamados. Variável de alto impacto para análise preditiva de risco de SLA."
    columns:
      - name: dim_grupo_sk
        description: "Chave substituta (Surrogate Key) primária gerada via hash MD5 do nome do grupo designado."
        tests:
          - unique
          - not_null
      - name: grupo_designado
        description: "Nome textual da equipe responsável pelo ticket de incidentes."
  - name: dim_tempo
    description: "Tabela dimensão de calendário analítico baseada na data de abertura do incidente. Contém atributos temporais expandidos para análise de sazonalidade no Prophet e relatórios no Power BI."
    columns:
      - name: dim_tempo_sk
        description: "Chave substituta (Surrogate Key) primária obtida através do hash MD5 da data pura de abertura."
        tests:
          - unique
          - not_null
      - name: data_abertura
        description: "Data pura do incidente (Ano-Mês-Dia) utilizada como âncora temporal."
  - name: dim_status
    description: "Tabela dimensão que armazena o status, códigos de fechamento do ticket e a flag de elegibilidade contratual para metas de KPI."
    columns:
      - name: dim_status_sk
        description: "Chave substituta (Surrogate Key) primária gerada via hash MD5 da combinação entre Status e Código de Fechamento."
        tests:
          - unique
          - not_null
      - name: status
        description: "Estado atual ou final do incidente (Ex: Encerrado, Resolvido)."
  - name: dim_prioridade
    description: "Tabela dimensão contendo os níveis de prioridade mapeados, thresholds contratuais de SLA em horas e agrupamentos de criticidade para atendimento dos requisitos do desafio (análise P2 e P3)."
    columns:
      - name: dim_prioridade_sk
        description: "Chave substituta (Surrogate Key) primária gerada via hash MD5 do número identificador da prioridade."
        tests:
          - unique
          - not_null
      - name: prioridade_num
        description: "Código numérico purificado da prioridade (1 a 5)."